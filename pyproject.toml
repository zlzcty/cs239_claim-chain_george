[project]
name = "claim-chain"
version = "0.1.0"
description = "A local multi-agent citation audit demo"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["openai>=1.100,<3", "jinja2>=3.1,<4", "pydantic>=2.11,<3", "textual>=7.5,<8"]

[project.scripts]
claim-audit = "claim_chain:main"
claim-audit-tui = "claim_chain.tui:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "mypy>=1.15"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 99
